[versions]
agp = "8.13.0"
kotlin = "2.4.10"

composeBom = "2026.06.01"
coreKtx = "1.17.0"
activityCompose = "1.11.0"

lifecycle = "2.9.4"

cameraX = "1.6.1"

mlkitBarcode = "17.3.0"

tensorflowLite = "2.17.0"
tensorflowSupport = "0.5.0"

[libraries]

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

androidx-compose-ui = { module = "androidx.compose.ui:ui" }

androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }

androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

androidx-material3 = { module = "androidx.compose.material3:material3" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }

androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }

androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }

androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }

tensorflow-lite-support = { module = "org.tensorflow:tensorflow-lite-support", version.ref = "tensorflowSupport" }

tensorflow-lite-metadata = { module = "org.tensorflow:tensorflow-lite-metadata", version.ref = "tensorflowSupport" }

tensorflow-lite-gpu = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tensorflowLite" }

tensorflow-lite-gpu-api = { module = "org.tensorflow:tensorflow-lite-gpu-api", version.ref = "tensorflowLite" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }